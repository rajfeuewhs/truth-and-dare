<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth & Dare Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <h1 class="glow-text">Truth or Dare</h1>
        
        <div class="bottle-stage">
            <div id="bottle" class="neon-bottle"></div>
        </div>

        <div class="controls">
            <button id="spin-btn">SPIN THE BOTTLE</button>
            <div id="game-panel" class="hidden">
                <h3 id="player-label">Who's Next?</h3>
                <div class="choice-row">
                    <button class="t-btn" onclick="play('truth')">Truth</button>
                    <button class="d-btn" onclick="play('dare')">Dare</button>
                </div>
                <div id="display-card" class="card">Spin to start...</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
