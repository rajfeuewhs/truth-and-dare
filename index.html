<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin Bottle Pro Max</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
height:100vh;
color:#00ffaa;
text-align:center;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

.pointer{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
font-size:40px;
color:#ff0044;
}

#bottle{
max-height:65vh;
max-width:90vw;
filter:drop-shadow(0 0 25px rgba(0,255,150,0.4));
}

.spin-btn,.full-btn{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:40px;
cursor:pointer;
background:linear-gradient(45deg,#00ffaa,#0088ff);
color:black;
margin:10px;
}

.spin-btn{
position:fixed;
bottom:140px;
left:50%;
transform:translateX(-50%);
}

.popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
backdrop-filter:blur(10px);
justify-content:center;
align-items:center;
padding:20px;
}

.popup-content{
background:#111;
color:#00ffaa;
padding:30px;
border-radius:25px;
max-width:600px;
box-shadow:0 0 40px #00ffaa;
}

#dareText{
font-size:22px;
}

.close-btn{
margin-top:20px;
padding:10px 25px;
border:none;
background:red;
color:white;
border-radius:30px;
cursor:pointer;
}

.confetti{
position:fixed;
width:12px;
height:12px;
top:0;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="pointer">⬇</div>

<button class="spin-btn" onclick="spinBottle()">SPIN</button>

<img id="bottle" src="bottle.png">

<button class="full-btn" onclick="toggleFull()">📱 Fullscreen</button>

<audio id="spinSound"
src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-wheel-2079.mp3"></audio>

<div id="popup" class="popup">
<div class="popup-content">
<h2>Dare</h2>
<p id="dareText"></p>
<button class="close-btn" onclick="closePopup()">Close</button>
</div>
</div>

<script>

/* Galaxy Background */

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];

for(let i=0;i<150;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
s:Math.random()*0.5
});
}

function animateStars(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";

stars.forEach(star=>{
ctx.beginPath();
ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
ctx.fill();

star.y+=star.s;
if(star.y>canvas.height) star.y=0;
});

requestAnimationFrame(animateStars);
}

animateStars();

/* 1000+ GF BF DARES */

var actions=[
"give a compliment",
"say something romantic",
"send a cute message",
"say a pickup line",
"share a secret",
"do a funny dance",
"sing a romantic line",
"tell why you like them",
"send a selfie",
"act like a movie hero",
"say something cute",
"tell an embarrassing moment",
"pretend to propose",
"act jealous",
"say your crush name"
];

var targets=[
"to your crush",
"to your partner",
"to the person on left",
"to the person on right",
"to the spinner",
"to your best friend",
"to someone you like",
"to the tallest person",
"to the shortest person",
"to everyone"
];

var endings=[
"for 10 seconds",
"for 20 seconds",
"right now",
"without laughing",
"with confidence",
"while dancing",
"while smiling",
"like a movie character",
"dramatically",
"with full energy"
];

var dares=[];

for(let i=0;i<1000;i++){
let dare=
actions[Math.floor(Math.random()*actions.length)]+" "+
targets[Math.floor(Math.random()*targets.length)]+" "+
endings[Math.floor(Math.random()*endings.length)];

dares.push(dare);
}

var remainingDares=[...dares];

/* Bottle Spin */

var spinning=false;
var angle=0;

function getRandomDare(){
if(remainingDares.length===0){
remainingDares=[...dares];
}
var index=Math.floor(Math.random()*remainingDares.length);
return remainingDares.splice(index,1)[0];
}

function spinBottle(){

if(spinning) return;

spinning=true;

var bottle=document.getElementById("bottle");
var sound=document.getElementById("spinSound");

sound.play();

let velocity = 60 + Math.random()*30;
let friction = 0.987 + Math.random()*0.003;

function rotate(){
velocity*=friction;
angle+=velocity;
bottle.style.transform="rotate("+angle+"deg)";

if(velocity>0.25){
requestAnimationFrame(rotate);
}else{
spinning=false;
showDare();
}
}

rotate();
}

function showDare(){
document.getElementById("dareText").innerText=getRandomDare();
document.getElementById("popup").style.display="flex";
createConfetti();
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function toggleFull(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}
}

function createConfetti(){
for(let i=0;i<60;i++){
let confetti=document.createElement("div");
confetti.classList.add("confetti");
confetti.style.left=Math.random()*100+"vw";
confetti.style.background="hsl("+Math.random()*360+",100%,50%)";
document.body.appendChild(confetti);

setTimeout(()=>confetti.remove(),3000);
}
}

</script>

</body>
  </html>
