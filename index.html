<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin Bottle</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
height:100vh;
color:#00ffaa;
text-align:center;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

.pointer{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
font-size:40px;
color:#ff0044;
}

#bottle{
max-height:65vh;
max-width:90vw;
filter:drop-shadow(0 0 25px rgba(0,255,150,0.4));
}

.spin-btn,.full-btn{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:40px;
cursor:pointer;
background:linear-gradient(45deg,#00ffaa,#0088ff);
color:black;
margin:10px;
}

.spin-btn{
position:fixed;
bottom:140px;
left:50%;
transform:translateX(-50%);
}

.popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
backdrop-filter:blur(10px);
justify-content:center;
align-items:center;
padding:20px;
}

.popup-content{
background:#111;
color:#00ffaa;
padding:30px;
border-radius:25px;
max-width:600px;
box-shadow:0 0 40px #00ffaa;
}

#dareText{
font-size:22px;
line-height:1.5;
}

.close-btn{
margin-top:20px;
padding:10px 25px;
border:none;
background:red;
color:white;
border-radius:30px;
cursor:pointer;
}

.confetti{
position:fixed;
width:12px;
height:12px;
top:0;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="pointer">⬇</div>

<button class="spin-btn" onclick="spinBottle()">SPIN</button>

<img id="bottle" src="bottle.png">

<button class="full-btn" onclick="toggleFull()">📱 Fullscreen</button>

<audio id="spinSound"
src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-wheel-2079.mp3"></audio>

<div id="popup" class="popup">
<div class="popup-content">
<h2>Dare</h2>
<p id="dareText"></p>
<button class="close-btn" onclick="closePopup()">Close</button>
</div>
</div>

<script>

/* Galaxy Background */

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];

for(let i=0;i<150;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
s:Math.random()*0.5
});
}

function animateStars(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";

stars.forEach(star=>{
ctx.beginPath();
ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
ctx.fill();

star.y+=star.s;
if(star.y>canvas.height) star.y=0;
});

requestAnimationFrame(animateStars);
}

animateStars();

/* DARES */

var dares=[

"Give someone in the room a genuine compliment without overthinking it.",
"Make eye contact with the person to your left for 15 seconds without laughing.",
"Send a random emoji to the last person you texted.",
"Act out what your ideal first date looks like — no explaining.",
"Pick a song you’d put on to set a flirty mood.",
"Describe your perfect romantic movie moment in one sentence.",
"Give your best confident walk across the room.",
"Tell someone in the room one thing you admire about their vibe.",
"Pretend you’re introducing yourself on a first date — confidence only.",
"Text someone you like (or liked) a simple 'thinking of you.'",
"Repeat the hottest compliment you’ve ever received like you’re bragging.",
"Choose someone and say what makes them instantly likable.",
"Recreate your go-to 'I’m interested' body language move.",
"Pick a word you think is underratedly romantic and explain why.",
"Make up a flirty but harmless nickname for yourself.",
"Tell the group what kind of date would immediately win you over.",
"Give a dramatic reading of a totally normal sentence.",
"Choose someone and guess what their ideal date vibe is.",
"Hold hands with the person next to you for the rest of the round.",
"Give your best subtle smile — the kind that says 'I know something you don’t.'",
"Lean in and say one word you’d only use when flirting.",
"Send a 😏 emoji to the person you’re playing with.",
"Say one flirty sentence you’d feel confident texting someone.",
"Pick a song you’d put on to set a mood and play 10 seconds of it.",
"Give someone a compliment that’s not about their appearance.",
"Say someone’s name in your flirtiest tone.",
"Show a pic of the last outfit you wore that made you feel hot."

];

var remainingDares=[...dares];

/* Bottle Spin */

var spinning=false;
var angle=0;

function getRandomDare(){
if(remainingDares.length===0){
remainingDares=[...dares];
}
var index=Math.floor(Math.random()*remainingDares.length);
return remainingDares.splice(index,1)[0];
}

function spinBottle(){

if(spinning) return;

spinning=true;

var bottle=document.getElementById("bottle");
var sound=document.getElementById("spinSound");

sound.play();

let velocity = 60 + Math.random()*30;
let friction = 0.987 + Math.random()*0.003;

function rotate(){
velocity*=friction;
angle+=velocity;
bottle.style.transform="rotate("+angle+"deg)";

if(velocity>0.25){
requestAnimationFrame(rotate);
}else{
spinning=false;
showDare();
}
}

rotate();
}

function showDare(){
document.getElementById("dareText").innerText=getRandomDare();
document.getElementById("popup").style.display="flex";
createConfetti();
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function toggleFull(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}
}

function createConfetti(){
for(let i=0;i<60;i++){
let confetti=document.createElement("div");
confetti.classList.add("confetti");
confetti.style.left=Math.random()*100+"vw";
confetti.style.background="hsl("+Math.random()*360+",100%,50%)";
document.body.appendChild(confetti);

setTimeout(()=>confetti.remove(),3000);
}
}

</script>

</body>
  </html>
