<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spin Bottle Pro Max</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
height:100vh;
color:#00ffaa;
transition:0.5s;
}

/* Neon Mode */
.neon{
background:radial-gradient(circle,#001f2f,#000);
color:#00ffff;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

.pointer{
position:fixed;
top:10px;
font-size:40px;
color:#ff0044;
}

#bottle{
height:75vh;
filter:drop-shadow(0 0 25px rgba(0,255,150,0.4));
}

.spin-btn, .neon-btn{
position:fixed;
padding:15px 40px;
font-size:18px;
border:none;
border-radius:40px;
cursor:pointer;
background:linear-gradient(45deg,#00ffaa,#0088ff);
color:black;
}

.spin-btn{ bottom:30px; }
.neon-btn{ bottom:90px; }

.popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
backdrop-filter:blur(10px);
}

.popup-content{
background:#111;
color:#00ffaa;
padding:50px;
border-radius:25px;
width:90%;
max-width:600px;
margin:10% auto;
text-align:center;
box-shadow:0 0 40px #00ffaa;
}

.close-btn{
margin-top:20px;
padding:10px 30px;
border:none;
background:red;
color:white;
border-radius:30px;
cursor:pointer;
}

.confetti{
position:fixed;
width:12px;
height:12px;
top:0;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<div class="pointer">⬇</div>

<img id="bottle" src="bottle.png">

<button class="neon-btn" onclick="toggleNeon()">💎 Neon Mode</button>
<button class="spin-btn" onclick="spinBottle()">SPIN</button>

<audio id="spinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-wheel-2079.mp3"></audio>

<div id="popup" class="popup">
<div class="popup-content">
<h2>Dare</h2>
<p id="dareText"></p>
<button class="close-btn" onclick="closePopup()">Close</button>
</div>
</div>

<script>

/* 🌌 Galaxy Background */
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<150;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
s:Math.random()*0.5
});
}

function animateStars(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
stars.forEach(star=>{
ctx.beginPath();
ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
ctx.fill();
star.y+=star.s;
if(star.y>canvas.height) star.y=0;
});
requestAnimationFrame(animateStars);
}
animateStars();

/* GAME LOGIC */
var spinning=false;
var angle=0;

var dares=[
"Put an ice cube in your underwear for one minute.",
"Perform a sexy belly dance for your partner.",
"Blindfold your partner and guide them around your body using only touch.",
"Undress your partner using only your teeth.",
"Clean the house naked.",
"Go about your normal day but with no underwear on.",
"Give your partner a massage, blindfolded.",
"Fake an orgasm for one minute.",
"Play spin the bottle and kiss the person the bottle chooses.",
"Act out your favorite position with the person to your left.",
"Pretend to give oral action to a bottle for 30 seconds.",
"If there’s a pool or hot tub, go skinny-dipping.",
"Hold hands with the person you know least for one minute.",
"Send a sexy selfie to someone in your contact list.",
"Take a body shot creatively.",
"Swap underwear with the person to your right.",
"Reply to a social media post with a sexy emoji.",
"Transfer an ice cube from your mouth to someone else’s.",
"Give a lap dance to a friend.",
"Remove an item of clothing.",
"Twerk for 30 seconds.",
"Perform a striptease for 30 seconds.",
"Roleplay a fantasy of your choice.",
"Give a foot massage for one minute.",

"Use each other as a human plate with whipped cream or chocolate.",
"Share a fantasy your partner never heard before.",
"Read an erotic bedtime story out loud.",
"Set up a nude photo shoot.",
"Sext your partner during work.",
"Give your partner a lap dance.",
"Pick one body part and focus attention there.",
"Try a new pick-up line.",
"Re-enact your first kiss.",
"Play the rest of the game naked.",
"Feed your partner using only your mouth.",
"Give a full-body massage.",
"Kiss passionately like a movie climax.",
"Use body paint creatively.",
"Twerk to the sexiest song.",
"Confess a guilty pleasure.",
"Sexy pillow fight challenge.",
"Spell what you want using emojis.",
"Blindfold yourself and guess body parts.",
"Balance an ice cube on your belly.",
"Describe why something turned you on.",
"Strut wearing partner’s clothes.",
"Pretend action with nearest object.",
"Try tantric connection."
];

function spinBottle(){
if(spinning) return;
spinning=true;

var bottle=document.getElementById("bottle");
var sound=document.getElementById("spinSound");

sound.play();

let velocity=50;

function rotate(){
velocity*=0.97;
angle+=velocity;
bottle.style.transform="rotate("+angle+"deg)";

if(velocity>0.5){
requestAnimationFrame(rotate);
}else{
spinning=false;
showDare();
}
}
rotate();
}

function showDare(){
var random=Math.floor(Math.random()*dares.length);
document.getElementById("dareText").innerText=dares[random];
document.getElementById("popup").style.display="block";
createConfetti();
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function createConfetti(){
for(let i=0;i<60;i++){
let confetti=document.createElement("div");
confetti.classList.add("confetti");
confetti.style.left=Math.random()*100+"vw";
confetti.style.background="hsl("+Math.random()*360+",100%,50%)";
document.body.appendChild(confetti);
setTimeout(()=>{confetti.remove();},3000);
}
}

function toggleNeon(){
document.body.classList.toggle("neon");
}

</script>

</body>
</html>
