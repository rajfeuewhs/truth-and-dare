<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin Bottle Pro Max</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
height:100vh;
color:#00ffaa;
transition:0.5s;
text-align:center;
}

/* Neon Mode */
.neon{
background:radial-gradient(circle,#001f2f,#000);
color:#00ffff;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* Pointer */
.pointer{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
font-size:40px;
color:#ff0044;
}

/* Bottle Fix */
#bottle{
height:auto;
max-height:65vh;
max-width:90vw;
width:auto;
object-fit:contain;
display:block;
margin:auto;
filter:drop-shadow(0 0 25px rgba(0,255,150,0.4));
}

/* Buttons */
.spin-btn, .neon-btn, .full-btn{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:40px;
cursor:pointer;
background:linear-gradient(45deg,#00ffaa,#0088ff);
color:black;
margin:10px;
}

/* Popup */
.popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
backdrop-filter:blur(10px);
justify-content:center;
align-items:center;
padding:20px;
}

.popup-content{
background:#111;
color:#00ffaa;
padding:30px 25px;
border-radius:25px;
width:95%;
max-width:600px;
text-align:center;
box-shadow:0 0 40px #00ffaa;
}

.popup-content h2{
font-size:28px;
margin-bottom:15px;
}

#dareText{
font-size:22px;
line-height:1.5;
}

.close-btn{
margin-top:20px;
padding:10px 25px;
border:none;
background:red;
color:white;
border-radius:30px;
cursor:pointer;
}

/* Confetti */
.confetti{
position:fixed;
width:12px;
height:12px;
top:0;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="pointer">⬇</div>

<img id="bottle" src="bottle.png">

<button class="full-btn" onclick="toggleFull()">📱 Fullscreen</button>
<button class="neon-btn" onclick="toggleNeon()">💎 Neon Mode</button>
<button class="spin-btn" onclick="spinBottle()">SPIN</button>

<audio id="spinSound"
src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-wheel-2079.mp3"></audio>

<div id="popup" class="popup">
<div class="popup-content">
<h2>Dare</h2>
<p id="dareText"></p>
<button class="close-btn" onclick="closePopup()">Close</button>
</div>
</div>

<script>

/* 🌌 Galaxy Background */

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];

for(let i=0;i<150;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
s:Math.random()*0.5
});
}

function animateStars(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";

stars.forEach(star=>{
ctx.beginPath();
ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
ctx.fill();

star.y+=star.s;

if(star.y>canvas.height) star.y=0;
});

requestAnimationFrame(animateStars);
}

animateStars();


/* GAME LOGIC */

var spinning=false;
var angle=0;

var dares=[
"Put an ice cube in your underwear for one minute.",
"Perform a sexy belly dance.",
"Dance crazy for 30 seconds.",
"Sing loudly for 20 seconds.",
"Act like a villain.",
"Confess something funny.",
"Give a lap dance.",
"Twerk for 30 seconds.",
"Kiss passionately.",
"Try a new pick-up line."
];

function spinBottle(){

if(spinning) return;

spinning=true;

var bottle=document.getElementById("bottle");
var sound=document.getElementById("spinSound");

sound.play();

let velocity=50;

function rotate(){

velocity*=0.97;
angle+=velocity;

bottle.style.transform="rotate("+angle+"deg)";

if(velocity>0.5){
requestAnimationFrame(rotate);
}else{
spinning=false;
showDare();
}

}

rotate();
}

function showDare(){

var random=Math.floor(Math.random()*dares.length);

document.getElementById("dareText").innerText=dares[random];

document.getElementById("popup").style.display="flex";

createConfetti();

}

function closePopup(){
document.getElementById("popup").style.display="none";
}


/* Fullscreen */

function toggleFull(){

if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}

}


/* Confetti */

function createConfetti(){

for(let i=0;i<60;i++){

let confetti=document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left=Math.random()*100+"vw";
confetti.style.background="hsl("+Math.random()*360+",100%,50%)";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},3000);

}

}


/* Neon */

function toggleNeon(){
document.body.classList.toggle("neon");
}

</script>

</body>
</html>
