<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spin The Bottle Ultimate</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
height:100vh;
color:#00ffaa;
}

/* 🌌 Galaxy Background */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* Pointer */
.pointer{
position:fixed;
top:10px;
font-size:40px;
color:#ff0044;
}

/* Bottle Image */
#bottle{
height:75vh;
transition:transform 5s cubic-bezier(.1,.7,.2,1);
filter:drop-shadow(0 0 30px rgba(0,255,150,0.4));
}

/* Spin Button */
.spin-btn{
position:fixed;
bottom:30px;
padding:15px 50px;
font-size:22px;
border:none;
border-radius:40px;
cursor:pointer;
background:linear-gradient(45deg,#00ffaa,#0088ff);
color:black;
}

/* Popup */
.popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
backdrop-filter:blur(10px);
}

.popup-content{
background:#111;
color:#00ffaa;
padding:50px;
border-radius:25px;
width:90%;
max-width:600px;
margin:10% auto;
text-align:center;
box-shadow:0 0 40px #00ffaa;
}

.close-btn{
margin-top:20px;
padding:10px 30px;
border:none;
background:red;
color:white;
border-radius:30px;
cursor:pointer;
}

/* Confetti */
.confetti{
position:fixed;
width:12px;
height:12px;
top:0;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<div class="pointer">⬇</div>

<!-- 🥃 YOUR REAL BOTTLE -->
<img id="bottle" src="bottle.png">

<button class="spin-btn" onclick="spinBottle()">SPIN</button>

<div id="popup" class="popup">
<div class="popup-content">
<h2>Dare</h2>
<p id="dareText"></p>
<button class="close-btn" onclick="closePopup()">Close</button>
</div>
</div>

<script>

/* 🌌 Galaxy Background */
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<150;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
s:Math.random()*0.5
});
}

function animateStars(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
stars.forEach(star=>{
ctx.beginPath();
ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
ctx.fill();
star.y+=star.s;
if(star.y>canvas.height) star.y=0;
});
requestAnimationFrame(animateStars);
}
animateStars();

/* Game Logic */
var spinning=false;

var dares=[
"Do 20 pushups 😈",
"Dance crazy for 30 seconds 🔥",
"Sing loudly for 20 sec 🎤",
"Act like a villain 😎",
"Talk in slow motion for 2 min 🐢",
"Confess something funny 😂"
];

function spinBottle(){
if(spinning) return;
spinning=true;

var bottle=document.getElementById("bottle");
var randomDegree=Math.floor(Math.random()*3600+1440);

bottle.style.transform="rotate("+randomDegree+"deg)";

setTimeout(function(){
showDare();
spinning=false;
},5000);
}

function showDare(){
var random=Math.floor(Math.random()*dares.length);
document.getElementById("dareText").innerText=dares[random];
document.getElementById("popup").style.display="block";
createConfetti();
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function createConfetti(){
for(let i=0;i<60;i++){
let confetti=document.createElement("div");
confetti.classList.add("confetti");
confetti.style.left=Math.random()*100+"vw";
confetti.style.background="hsl("+Math.random()*360+",100%,50%)";
document.body.appendChild(confetti);
setTimeout(()=>{confetti.remove();},3000);
}
}

</script>

</body>
</html>
