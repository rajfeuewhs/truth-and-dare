<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Code Bottle Spin</title>

<style>
body{
margin:0;
overflow:hidden;
background:radial-gradient(circle at center,#111,#000);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
font-family:Arial;
color:#00ffff;
}

svg{
height:80vh;
transition:transform 4s cubic-bezier(.17,.67,.83,.67);
filter:drop-shadow(0 0 40px #00ffff);
}

.spin-btn{
position:fixed;
bottom:30px;
padding:15px 50px;
font-size:22px;
border:none;
border-radius:40px;
cursor:pointer;
background:linear-gradient(45deg,#00ffff,#0088ff);
color:black;
}

.popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
backdrop-filter:blur(10px);
}

.popup-content{
background:#111;
color:#00ffff;
padding:50px;
border-radius:25px;
width:90%;
max-width:600px;
margin:10% auto;
text-align:center;
box-shadow:0 0 40px #00ffff;
}

.close-btn{
margin-top:20px;
padding:10px 30px;
border:none;
background:red;
color:white;
border-radius:30px;
cursor:pointer;
}

.confetti{
position:fixed;
width:12px;
height:12px;
top:0;
animation:fall 3s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}
</style>
</head>

<body>

<!-- 🧿 CODE MADE BOTTLE -->
<svg id="bottle" viewBox="0 0 200 600">
<defs>
<linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#00ffaa"/>
<stop offset="100%" stop-color="#006644"/>
</linearGradient>
</defs>

<!-- Bottle Neck -->
<rect x="85" y="0" width="30" height="100" fill="url(#glass)" />

<!-- Bottle Body -->
<path d="M60 100 
         Q50 200 50 400 
         Q50 550 100 580 
         Q150 550 150 400 
         Q150 200 140 100 Z" 
fill="url(#glass)"/>
</svg>

<button class="spin-btn" onclick="spinBottle()">SPIN</button>

<div id="popup" class="popup">
<div class="popup-content">
<h2>Dare</h2>
<p id="dareText"></p>
<button class="close-btn" onclick="closePopup()">Close</button>
</div>
</div>

<script>

var spinning=false;

var dares=[
"Do 20 pushups 😈",
"Dance crazy for 30 seconds 🔥",
"Sing loudly for 20 sec 🎤",
"Act like a villain 😎",
"Talk in slow motion for 2 min 🐢"
];

function spinBottle(){
if(spinning) return;
spinning=true;

var bottle=document.getElementById("bottle");
var randomDegree=Math.floor(Math.random()*3600+1440);

bottle.style.transform="rotate("+randomDegree+"deg)";

setTimeout(function(){
showDare();
spinning=false;
},4000);
}

function showDare(){
var random=Math.floor(Math.random()*dares.length);
document.getElementById("dareText").innerText=dares[random];
document.getElementById("popup").style.display="block";
createConfetti();
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function createConfetti(){
for(let i=0;i<60;i++){
let confetti=document.createElement("div");
confetti.classList.add("confetti");
confetti.style.left=Math.random()*100+"vw";
confetti.style.background="hsl("+Math.random()*360+",100%,50%)";
document.body.appendChild(confetti);

setTimeout(()=>{confetti.remove();},3000);
}
}

</script>

</body>
</html>
