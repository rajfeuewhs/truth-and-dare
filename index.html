<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare - Private</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Truth or Dare</h1>
        <div class="wheel-container">
            <div id="wheel" class="wheel">?</div>
            <div class="pointer"></div>
        </div>
        
        <button id="spin-btn">Spin the Wheel</button>
        
        <div id="result-area" class="hidden">
            <h2 id="player-turn"></h2>
            <div class="options">
                <button onclick="getTask('truth')">Truth</button>
                <button onclick="getTask('dare')">Dare</button>
            </div>
            <p id="task-display"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
